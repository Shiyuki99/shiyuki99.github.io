<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Render Source</title>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #050505;
      overflow: hidden;
      width: 960px;
      height: 720px;
      position: relative;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .hero-light {
      position: absolute;
      z-index: 0;
      width: 640px;
      height: 640px;
      top: 12%;
      left: -8%;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.045) 0%, rgba(229, 62, 62, 0.03) 40%, transparent 70%);
      opacity: 0;
    }

    .scanline {
      position: absolute;
      left: -6%;
      right: -6%;
      top: 0;
      height: 2px;
      z-index: 3;
      background: linear-gradient(90deg, transparent, rgba(229, 62, 62, 0.85), transparent);
      box-shadow: 0 0 24px rgba(229, 62, 62, 0.55);
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <canvas id="hero-canvas"></canvas>
  <div class="hero-light" id="hero-light"></div>
  <div class="scanline" id="scanline"></div>

  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js" } }
  </script>

  <script type="module">
    import * as THREE from 'three';

    const canvas = document.getElementById('hero-canvas');
    const W = 960, H = 720;

    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setSize(W, H, false);
    renderer.setPixelRatio(2);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 100);
    camera.position.z = 7;

    const group = new THREE.Group();
    scene.add(group);
    const outer = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(1.9, 1)),
      new THREE.LineBasicMaterial({ color: 0xE53E3E, transparent: true, opacity: 0.22 })
    );
    const inner = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(1.05, 0)),
      new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.07 })
    );
    group.add(outer, inner);
    group.position.set(2.7, 0.1, 0);

    const particleCount = 130;
    const positions = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount; i++) {
      const r = 2.5 + Math.random() * 1.3;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(Math.random() * 2 - 1);
      positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      positions[i * 3 + 2] = r * Math.cos(phi);
    }
    const dustGeo = new THREE.BufferGeometry();
    dustGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
      color: 0xE53E3E, size: 0.035, transparent: true, opacity: 0.45,
    }));
    scene.add(dust);

    const grid = new THREE.GridHelper(26, 34, 0xffffff, 0xffffff);
    grid.material.transparent = true;
    grid.material.opacity = 0.03;
    grid.position.y = -3.4;
    scene.add(grid);

    const light = document.getElementById('hero-light');
    const scanline = document.getElementById('scanline');

    // All animation state — step-based, no real-time clock
    let elapsed = 0;
    const rotationSpeed = 0.0016;
    const parallaxStrength = 0.08;
    const scanlinePeriod = 16000; // every 16 seconds
    const glowPeriod = 4200;

    function stepFrame(dtMs) {
      const dt = dtMs * 0.001;
      elapsed += dtMs;

      // Three.js rotation
      group.rotation.y += rotationSpeed;
      group.rotation.x += rotationSpeed * 0.35;
      inner.rotation.y -= rotationSpeed * 1.6;
      dust.rotation.y -= rotationSpeed * 0.5;
      group.position.y += Math.sin(elapsed * 0.0004) * 0.0012;

      camera.position.x = Math.sin(elapsed * 0.0003) * parallaxStrength * 2.2;
      camera.position.y = Math.cos(elapsed * 0.0004) * parallaxStrength * 1.8;
      camera.lookAt(group.position.x * 0.45, 0, 0);

      renderer.render(scene, camera);

      // Glow breathing (starts after 2s)
      if (elapsed > 2050) {
        light.style.opacity = '1';
        const phase = ((elapsed - 2050) % glowPeriod) / glowPeriod;
        const breathe = 0.85 + 0.15 * Math.sin(phase * Math.PI * 2);
        light.style.transform = `scale(${1 + (breathe - 0.85) * 0.47})`;
        light.style.opacity = String(0.7 + 0.3 * breathe);
      }

      // Scanline — sweeps top to bottom over 2.5s, rests
      const scanPhase = (elapsed % scanlinePeriod);
      if (scanPhase < 2500) {
        const p = scanPhase / 2500;
        scanline.style.top = (p * 100) + '%';
        scanline.style.opacity = p < 0.15 ? String(p / 0.15) : p > 0.85 ? String((1 - p) / 0.15) : '1';
      } else {
        scanline.style.opacity = '0';
      }
    }

    // Initial render
    stepFrame(0);
    window.__ready = true;

    // Expose step-based frame advance for Puppeteer
    window.__stepFrame = (dtMs) => {
      stepFrame(dtMs);
    };
  </script>
</body>

</html>
