<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Frame Render Source</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent;
    width: 500px;
    height: 700px;
    overflow: hidden;
  }
  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    will-change: transform;
  }
  .card-surface {
    --cut: 20px;
    position: absolute;
    inset: 0;
    z-index: 1;
    background: linear-gradient(155deg, rgba(26,26,26,0.97) 0%, rgba(9,9,9,0.99) 60%);
    border: 1px solid rgba(255,255,255,0.10);
    clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
    overflow: hidden;
    transition: border-color 0.5s ease, box-shadow 0.5s ease;
  }
  .card-surface::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(115deg,
      rgba(255,255,255,0.015) 0px,
      rgba(255,255,255,0.015) 1px,
      transparent 1px,
      transparent 7px);
    opacity: 0.5;
  }
  .card-inner::before {
    content: '';
    position: absolute;
    inset: 7px;
    z-index: 2;
    pointer-events: none;
    border: 1px solid rgba(255,255,255,0.05);
    clip-path: polygon(0 0, calc(100% - 13px) 0, 100% 13px, 100% 100%, 13px 100%, 0 calc(100% - 13px));
  }
  .card-inner::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background:
      linear-gradient(rgba(229,62,62,0.55) 0 0) top left / 20px 1px no-repeat,
      linear-gradient(rgba(229,62,62,0.55) 0 0) top left / 1px 20px no-repeat,
      linear-gradient(rgba(229,62,62,0.55) 0 0) bottom right / 20px 1px no-repeat,
      linear-gradient(rgba(229,62,62,0.55) 0 0) bottom right / 1px 20px no-repeat;
    opacity: 0.55;
  }
</style>
</head>
<body>
  <div class="card-inner">
    <div class="card-surface"></div>
  </div>
</body>
</html>
